<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8" />
    <title>Prek17: {{ product.name }}</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;} .meta{color:gray;margin-bottom:8px;} ul{list-style:none;padding:0;} li{padding:6px 0;border-bottom:1px solid #eee;}</style>
  </head>
  <body>
    <h1>{{ product.name }}</h1>

    <div class="product-group" data-product-name="{{ product.name }}" data-product-id="{{ product.id }}" style="margin-bottom:16px;">
      <h3 style="margin:0 0 6px 0;">{{ product.name }} {% if in_cart_qty > 0 %}<small style="color:gray;">(krepšelyje: {{ in_cart_qty }})</small>{% endif %}</h3>
      <ul style="margin:0 0 6px 0; padding-left:18px;">
        {% for p in stores %}
        <li>{{ p.store|title }} – {{ p.price }} €</li>
        {% endfor %}
      </ul>
      <div style="margin-top:6px;">
        <button class="qty-decr">−</button>
        <span class="qty" data-value="{{ in_cart_qty|default:1 }}">{{ in_cart_qty|default:1 }}</span>
        <button class="qty-incr">+</button>
        <button class="add-btn" style="margin-left:8px;">{% if in_cart_qty|default:0 > 0 %}Atnaujinti{% else %}Pridėti{% endif %}</button>
      </div>
    </div>

    <p><a href="/">Grįžti atgal</a></p>

    <script>
      // reuse add-to-cart logic used in search results
      function getCookie(name) {
        const cookies = document.cookie ? document.cookie.split(';') : [];
        for (let i = 0; i < cookies.length; i++) {
          const c = cookies[i].trim();
          if (c.startsWith(name + '=')) return decodeURIComponent(c.substring(name.length + 1));
        }
        return null;
      }

      document.addEventListener('click', function (e) {
        const tgt = e.target;

        if (tgt.classList.contains('qty-incr') || tgt.classList.contains('qty-decr')) {
          const container = tgt.closest('.product-group');
          if (!container) return;
          const qtySpan = container.querySelector('.qty');
          if (!qtySpan) return;
          let val = parseInt(qtySpan.dataset.value || qtySpan.textContent || '1', 10) || 1;
          if (tgt.classList.contains('qty-incr')) val = Math.min(10, val + 1);
          else val = Math.max(1, val - 1);
          qtySpan.dataset.value = String(val);
          qtySpan.textContent = String(val);
          return;
        }

        if (tgt.classList.contains('add-btn')) {
          const group = tgt.closest('.product-group');
          if (!group) return;
          const pid = group.dataset.productId;
          const qtySpan = group.querySelector('.qty');
          const qty = parseInt(qtySpan && (qtySpan.dataset.value || qtySpan.textContent) || '1', 10) || 1;
          const url = "/add-to-cart/";
          const csrftoken = getCookie('csrftoken');

          tgt.disabled = true;

          fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': csrftoken || ''
            },
            body: JSON.stringify({product_id: pid, quantity: qty})
          }).then(r => r.json()).then(data => {
            if (data && data.success) {
              const verb = data.action === 'updated' ? 'Atnaujinta' : 'Pridėta';
              tgt.textContent = verb + ' (' + data.quantity + ')';

              const h3 = group.querySelector('h3');
              if (h3) {
                let small = h3.querySelector('small');
                if (!small) {
                  small = document.createElement('small');
                  small.style.color = 'gray';
                  h3.appendChild(document.createTextNode(' '));
                  h3.appendChild(small);
                }
                small.textContent = '(krepšelyje: ' + data.quantity + ')';
              }

              setTimeout(() => { tgt.textContent = data.action === 'updated' ? 'Atnaujinti' : 'Pridėti'; tgt.disabled = false; }, 1200);
            } else if (data && data.error) {
              alert('Klaida: ' + data.error);
              tgt.disabled = false;
            }
          }).catch(err => {
            console.error(err);
            alert('Tinklo arba serverio klaida');
            tgt.disabled = false;
          });
        }
      });
    </script>
  </body>
</html>
