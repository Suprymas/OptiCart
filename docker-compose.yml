services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opticart-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: ${DB_ENGINE:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opticart_db}
      POSTGRES_USER: ${POSTGRES_USER:-opticart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opticart_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: opticart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opticart_db}
      POSTGRES_USER: ${POSTGRES_USER:-opticart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opticart_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opticart_user} -d ${POSTGRES_DB:-opticart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
