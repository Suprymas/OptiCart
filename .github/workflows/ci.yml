name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          DB_ENGINE=postgres
          POSTGRES_DB=opticart_db
          POSTGRES_USER=opticart_user
          POSTGRES_PASSWORD=opticart_password
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for the web app to become reachable
        run: |
          for attempt in $(seq 1 90); do
            if ! docker compose ps web | grep -q "Up"; then
              sleep 2
              continue
            fi

            login_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8000/login/ || true)
            root_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8000/ || true)

            if [ "$login_code" = "200" ]; then
              echo "Web app reachable: /login/ returned HTTP 200 (root returned HTTP $root_code)"
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Install test dependencies
        run: docker compose exec -T web python -m pip install pytest pytest-django

      - name: Run tests
        run: |
          docker compose exec -T web sh -lc "cd /app/backend; DB_ENGINE=sqlite DJANGO_SETTINGS_MODULE=core.settings PYTHONPATH=/app/backend pytest -c pytest.ini -o django_find_project=false tests"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down -v
