name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          DB_ENGINE=postgres
          POSTGRES_DB=opticart_db
          POSTGRES_USER=opticart_user
          POSTGRES_PASSWORD=opticart_password
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for the web app to become reachable
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000 >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Install test dependencies
        run: docker compose exec -T web python -m pip install pytest pytest-django

      - name: Run tests
        run: docker compose exec -T -e PYTHONPATH=/app/backend web pytest -c /app/backend/pytest.ini

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down -v
