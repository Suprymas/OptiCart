{% load static %}
<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}OptiCart{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/styles.css' %}" />
    <style>
      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
      }

      .site-nav {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .auth-links {
        display: flex;
        gap: 15px;
        align-items: center;
        border-left: 1px solid #ddd;
        padding-left: 20px;
      }

      .auth-links a,
      .auth-links form {
        display: inline-block;
      }

      .logout-btn {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font: inherit;
        text-decoration: none;
      }

      .logout-btn:hover {
        text-decoration: underline;
      }

      .user-info {
        color: #666;
        font-size: 14px;
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="site-header">
      <a class="brand" href="{% url 'shop:home' %}">
        <span class="brand-mark">O</span>
        <span>OptiCart</span>
      </a>
      <nav class="site-nav">
        <a href="{% url 'shop:home' %}">Pradžia</a>
        <a href="{% url 'shop:search' %}">Paieska</a>
        <a href="{% url 'shop:compare_demo' %}">Demo</a>
        <a href="{% url 'shop:compare' %}">Palyginimas</a>
        
        <div class="auth-links">
          {% if user.is_authenticated %}
            <span class="user-info">Sveiki, {{ user.username }}!</span>
            <form method="POST" action="{% url 'shop:logout' %}" style="margin: 0;">
              {% csrf_token %}
              <button type="submit" class="logout-btn">Atsijungti</button>
            </form>
          {% else %}
            <a href="{% url 'shop:login' %}">Prisijungimas</a>
          {% endif %}
        </div>
      </nav>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
