{% extends 'shop/base.html' %}

{% block title %}Kainų istorija{% endblock %}

{% block content %}
  <section class="card stack">
    <h1>Kainų istorija</h1>
    <p class="subtle">Pasirinkite prekę, kad peržiūrėtumėte kainų tendenciją.</p>
    <div class="stack">
      <div class="form-row" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <label for="chart_product">Prekė:</label>
        <select id="chart_product">
          {% for p in products %}
          <option value="{{ p.name }}" {% if p.name == selected_product %}selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>

        <label for="interval">Intervalas:</label>
        <select id="interval">
          <option value="7">7 dienos</option>
          <option value="30" selected>30 dienų</option>
          <option value="90">90 dienų</option>
        </select>

        <span>Parduotuvės:</span>
        <label><input type="checkbox" class="store-filter" value="barbora" checked /> Barbora</label>
        <label><input type="checkbox" class="store-filter" value="rimi" checked /> Rimi</label>
      </div>

      <div class="canvas-wrap">
        <canvas id="priceChart" width="700" height="300"></canvas>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const chartUrl = "{% url 'shop:compare_demo_chart' %}";
        let priceChart = null;

        async function loadChart(product, interval, stores) {
          const params = new URLSearchParams();
          params.set('product', product);
          params.set('interval', String(interval));
          params.set('stores', stores.join(','));

          const res = await fetch(`${chartUrl}?${params.toString()}`);
          const json = await res.json();
          if (json.error) {
            alert(json.error);
            return;
          }
          const seriesObj = json.series || {};
          const storesKeys = Object.keys(seriesObj);
          if (storesKeys.length === 0) {
            alert('Nėra duomenų');
            return;
          }

          const labels = seriesObj[storesKeys[0]].map(s => s.date);
          const colors = ['rgb(75, 192, 192)', 'rgb(255,99,132)', 'rgb(54,162,235)', 'rgb(153,102,255)'];
          const datasets = storesKeys.map((st, idx) => ({
            label: st,
            data: seriesObj[st].map(s => s.price),
            borderColor: colors[idx % colors.length],
            tension: 0.2,
            fill: false,
            spanGaps: true,
          }));

          const ctx = document.getElementById('priceChart').getContext('2d');
          if (priceChart) {
            priceChart.data.labels = labels;
            priceChart.data.datasets = datasets;
            priceChart.update();
          } else {
            priceChart = new Chart(ctx, {
              type: 'line',
              data: { labels: labels, datasets: datasets },
              options: {
                responsive: true,
                spanGaps: true,
                plugins: { tooltip: { mode: 'index', intersect: false } },
                interaction: { mode: 'nearest', axis: 'x', intersect: false },
                scales: {
                  x: { display: true, title: { display: true, text: 'Data' } },
                  y: { display: true, title: { display: true, text: 'Kaina' } }
                }
              }
            });
          }
        }

        function selectedStores() {
          return Array.from(document.querySelectorAll('.store-filter:checked')).map(el => el.value);
        }

        function reload() {
          const product = document.getElementById('chart_product').value;
          if (!product) {
            return;
          }
          const interval = parseInt(document.getElementById('interval').value, 10);
          const stores = selectedStores();
          if (!stores.length) {
            return;
          }
          loadChart(product, interval, stores);
        }

        document.getElementById('chart_product').addEventListener('change', reload);
        document.getElementById('interval').addEventListener('change', reload);
        document.querySelectorAll('.store-filter').forEach((el) => {
          el.addEventListener('change', reload);
        });

        // load initial
        reload();
    </script>
    <p><a href="{% url 'shop:compare' %}">Grįžti į palyginimą</a></p>
  </section>
{% endblock %}
